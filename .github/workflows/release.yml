name: Release Player APK

# Tag-driven build + GitHub release upload. Workflow:
#   1. Bump versionCode + versionName in app/build.gradle.kts
#   2. git commit + git tag v2.0.X
#   3. git push origin main --tags
# Within ~3 minutes the tagged release lands on the GitHub releases page
# with app-release.apk attached. The signagehub backend's
# LATEST_PLAYER_VERSION / LATEST_PLAYER_URL constants must be bumped in
# lockstep so /api/v1/player/latest tells already-deployed Players to
# upgrade themselves.
#
# Only tags matching v*.*.* trigger this workflow — push of plain commits
# never runs Gradle, keeping CI minutes low.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Manual run: tag or commit ref to build"
        required: true

permissions:
  contents: write  # required for softprops/action-gh-release to create the release

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release + upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
